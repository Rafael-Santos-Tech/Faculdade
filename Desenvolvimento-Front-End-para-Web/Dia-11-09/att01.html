<!DOCTYPE html>
<html lang="pt-br">

<body>
    <h1>Formulario</h1>
    <form>

        <input type="radio" value=“Feminino” name=“Sexo”>Feminino<br>
        <label> Login: </label>
        <input type="text" name=“login”><br>

        <input type="password" name=“senha”><br>
        <label>Onde estuda:</label><br>
        <input type="checkbox"name="onde_estuda"value="Cruzeiro do sul">SP<br>
        <input type="checkbox"name="onde_estuda"value="Liberdade">SP LIB<br>

        <input type="checkbox"name="onde_estuda"value="Guarulhos">GRU <br>

            <option> Nova Cruz </option>
            <option> Serrinha </option>
            <option> Montanhas </option>
            <option> Brejinho</option>

            <option> Natal</option>
        </select><br>
        <label>Observações</label><br>
        <textarea name="observacoes" rows="4" cols="20"></textarea><br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
